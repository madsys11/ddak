[package]
name = "ddak"
version = "0.1.0"
description = "딱 필요한 것만 담은 개인용 AI 작업 도구"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ddak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: 사용자의 claude 설정을 다시 쓸 때 키 순서를 그대로 둔다 (claude_trust.rs)
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.9.0"
tauri-plugin-dialog = "2.8.3"
notify = "8"
tiny_http = "0.12"
# 터미널 링크의 file:// 주소를 경로로 (links.rs), 모바일 화면 주소의 출처 (mobile.rs)
url = "2"
# 모바일 기기 토큰은 해시만 저장한다 (mobile.rs)
sha2 = "0.10"
# 폰에 보내는 Web Push: 암호화(RFC 8291)와 VAPID 서명(RFC 8292) (push.rs)
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
aes-gcm = "0.10"
hkdf = "0.12"
base64 = "0.22"
# 푸시 서비스로 보내기 (push.rs). tauri가 이미 쓰는 버전에 시스템 TLS만 켠다
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 자체 테스트가 네이티브 메뉴 항목을 실제 클릭 경로로 실행하는 데 쓴다 (src/selftest.rs)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder", "NSDockTile", "NSPasteboard", "NSPasteboardItem"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationResponse", "UNNotificationRequest", "UNNotificationSound", "UNNotificationTrigger"] }
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSFileManager", "NSURL", "NSError", "NSArray"] }
libc = "0.2"
