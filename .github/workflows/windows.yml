# Windows 빌드와 Rust 시험 (docs/windows-plan.md). 설치 파일(NSIS, 서명 없음)을 산출물로 올린다.
# main에 들어간 것과 수동 실행만.
name: Windows

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

# 액션은 Node 24에서 도는 판 (mobile-pages.yml과 같다).
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Windows 쪽 시험 (conpty.rs의 Job·종료 코드, platform.rs, fs.rs 이름 검사 등). 유닉스 전용 시험은 cfg(unix)
      - name: cargo test
        working-directory: src-tauri
        run: cargo test
      - name: Build installer
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v7
        with:
          name: ddak-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
